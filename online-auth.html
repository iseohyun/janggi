<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>웹장기 로그인</title>
  <!--
    Google 로그인 도우미 창 (module/online/firebase-backend.js가 연다).
    웹장기 본 화면은 Fairy-Stockfish 때문에 COOP: same-origin + COEP로 격리되어 있어 Google 팝업과 이야기할 수 없다.
    이 창은 coi-sw.js가 격리 헤더를 붙이지 않으므로 여기서 signInWithPopup을 하고,
    로그인 정보는 같은 출처의 IndexedDB에 남아 본 화면의 Firebase Auth가 읽어 간다.
    끝나면 BroadcastChannel("janggi-online-auth")로 본 화면에 알리고 스스로 닫는다.
    SDK 버전·설정값은 module/firebase-config.js 한 곳에서 읽는다.
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    main { width: 100%; max-width: 360px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0 0 18px; font-size: 13px; line-height: 1.55; color: #94a3b8; }
    button {
      width: 100%;
      min-height: 44px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #msg { margin-top: 14px; min-height: 1.4em; }
    #msg.error { color: #fda4af; }
    #msg.ok { color: #86efac; }
  </style>
  <script src="module/firebase-config.js" charset="UTF-8"></script>
</head>
<body>
  <main>
    <h1>웹장기 온라인 대국 로그인</h1>
    <p>아래 단추를 누르면 Google 로그인 창이 열립니다. 로그인하면 이 창은 저절로 닫히고 웹장기로 돌아갑니다.</p>
    <button id="go" type="button" disabled>Google로 로그인</button>
    <p id="msg" role="status" aria-live="polite">준비 중…</p>
  </main>
  <script type="module">
    const chan = new BroadcastChannel("janggi-online-auth");
    const msg = document.getElementById("msg");
    const go = document.getElementById("go");
    const say = (text, kind) => {
      msg.textContent = text;
      msg.className = kind || "";
    };
    try {
      const base = `https://www.gstatic.com/firebasejs/${window.JANGGI_FIREBASE_SDK}`;
      const { initializeApp } = await import(`${base}/firebase-app.js`);
      const {
        getAuth, GoogleAuthProvider, signInWithPopup, setPersistence, indexedDBLocalPersistence
      } = await import(`${base}/firebase-auth.js`);
      const app = initializeApp(window.JANGGI_FIREBASE_CONFIG);
      const auth = getAuth(app);
      await setPersistence(auth, indexedDBLocalPersistence);
      go.disabled = false;
      say("");
      go.addEventListener("click", async () => {
        go.disabled = true;
        say("Google 로그인 창에서 계정을 골라 주세요…");
        try {
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          await signInWithPopup(auth, provider);
          say("로그인했습니다. 웹장기로 돌아갑니다.", "ok");
          chan.postMessage({ type: "signed-in" });
          setTimeout(() => window.close(), 600);
        } catch (e) {
          console.error("[online-auth] Google 로그인 실패:", e);
          say(`로그인하지 못했습니다 (${e.code || e.message}).`, "error");
          chan.postMessage({ type: "error", code: e.code || "auth/internal-error" });
          go.disabled = false;
        }
      });
    } catch (e) {
      console.error("[online-auth] Firebase를 불러오지 못했습니다:", e);
      say("Firebase를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.", "error");
    }
  </script>
</body>
</html>
